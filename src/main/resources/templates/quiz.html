<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">
    <div class="w-full max-w-2xl bg-white rounded-lg shadow-lg p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Smart Quiz</h1>
            <div class="text-xl font-bold text-indigo-600">Score: <span th:text="${score}">0</span></div>
        </div>

        <div th:if="${lastAnswerCorrect != null}" class="mb-4 p-3 rounded-md text-white"
             th:classappend="${lastAnswerCorrect} ? 'bg-green-500' : 'bg-red-500'">
            <span th:text="${lastAnswerCorrect} ? 'Correct! Difficulty Increased.' : 'Incorrect. Difficulty Decreased.'"></span>
        </div>

        <div th:if="${question}">
            <h2 class="text-xl text-gray-700 mb-4" th:text="${question.text}">Question text goes here...</h2>
            <form action="/submit" method="post">
                <input type="hidden" name="questionId" th:value="${question.id}" />
                <div class="space-y-3">
                    <button type="submit" name="answer" value="A" class="w-full text-left p-4 bg-gray-200 rounded-lg hover:bg-indigo-200 transition-colors" th:text="${question.optionA}"></button>
                    <button type="submit" name="answer" value="B" class="w-full text-left p-4 bg-gray-200 rounded-lg hover:bg-indigo-200 transition-colors" th:text="${question.optionB}"></button>
                    <button type="submit" name="answer" value="C" class="w-full text-left p-4 bg-gray-200 rounded-lg hover:bg-indigo-200 transition-colors" th:text="${question.optionC}"></button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
